version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibio_postgres_dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: luxeshop
      POSTGRES_USER: luxeuser
      POSTGRES_PASSWORD: luxepass
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vibio_redis_dev
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes

  adminer:
    image: adminer
    container_name: vibio_adminer_dev
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
